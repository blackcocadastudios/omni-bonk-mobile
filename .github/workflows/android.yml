name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (NDK + aapt2 + d8)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tool versions
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms" "$ANDROID_HOME/ndk" || true
          cmake --version | head -1
          ninja --version || true

      - name: Check translation tables
        run: python3 scripts/check_lang.py

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"; export KEYSTORE="$RUNNER_TEMP/release.keystore"; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION_NAME="${GITHUB_REF_NAME#v}"; else export VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"; fi
          bash scripts/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniBonk-apk
          path: build/OmniBonk.apk
          if-no-files-found: error

      - name: Release "apk-latest" (branch pushes)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Android APK - latest build (${{ github.run_number }})
          body: |
            Automatic build of commit ${{ github.sha }} (branch ${{ github.ref_name }}).
            Download **OmniBonk.apk** and install it (allow installs from unknown sources).
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: build/OmniBonk.apk

      - name: GitHub release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/OmniBonk.apk

  emulator-smoke:
    name: Emulator smoke test + screenshots
    needs: build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OmniBonk-apk
          path: build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "no /dev/kvm"

      - name: Run on emulator (API 30, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/emulator_smoke.sh

      - name: Upload screenshots + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: build/emu/
          if-no-files-found: warn
